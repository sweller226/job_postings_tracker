name: Watch internship repos

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Record every current posting as seen without sending notifications"
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time so two runs can never race on state/seen.json.
concurrency:
  group: internship-watcher-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new postings
        env:
          SEED_ONLY: ${{ inputs.seed_only && '1' || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python watcher.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update seen postings [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Could not push state after 3 attempts." >&2
          exit 1
